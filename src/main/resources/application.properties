spring.application.name=tickets

# PostgreSQL runs in Docker for local development
spring.datasource.url=jdbc:postgresql://db:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=prod!

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format.sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/eventmaster
server.port=8081

#spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:9090/realms/eventmaster
spring.security.oauth2.client.provider.keycloak.authorization-uri=http://localhost:9090/realms/eventmaster/protocol/openid-connect/auth
spring.security.oauth2.client.provider.keycloak.token-uri=http://keycloak:8080/realms/eventmaster/protocol/openid-connect/token
spring.security.oauth2.client.provider.keycloak.user-info-uri=http://keycloak:8080/realms/eventmaster/protocol/openid-connect/userinfo
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=http://keycloak:8080/realms/eventmaster/protocol/openid-connect/certs

spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username